
# =====================================================
# CONFIGURACIÓN GENERAL DE TARPON MX
# =====================================================

# Nombre interno del proyecto Flutter.
# Debe escribirse en minúsculas y sin espacios.
name: tarpon_mx

# Descripción de nuestra aplicación.
description: "Aplicación móvil de pesca deportiva Tarpon MX."

# Evita publicar accidentalmente el paquete
# en el repositorio público pub.dev.
publish_to: 'none'

# Versión actual de la aplicación.
# 1.0.0 = versión del producto.
# +1 = número interno de compilación.
version: 1.0.0+1

# =====================================================
# VERSIÓN DE DART
# =====================================================

environment:

  # Versión mínima compatible de Dart.
  sdk: ^3.13.7

# =====================================================
# DEPENDENCIAS DE LA APLICACIÓN
# =====================================================

dependencies:

  # Framework principal utilizado para desarrollar
  # nuestra aplicación móvil.
  flutter:
    sdk: flutter

  # Proporciona iconos de estilo Cupertino.
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  supabase_flutter: ^2.18.3
  flutter_svg: ^2.5.0

# =====================================================
# DEPENDENCIAS PARA DESARROLLO
# =====================================================

dev_dependencies:

  # Permite ejecutar pruebas automatizadas.
  flutter_test:
    sdk: flutter

  # Reglas y recomendaciones para escribir
  # código Dart de buena calidad.
  flutter_lints: ^6.0.0

# =====================================================
# CONFIGURACIÓN DE FLUTTER
# =====================================================

flutter:

  # Habilita los iconos de Material Design.
  uses-material-design: true

  # ===================================================
  # RECURSOS VISUALES
  # ===================================================

  # Carpeta donde guardamos el logotipo oficial.
  #
  # Flutter podrá acceder a los archivos que
  # se encuentren dentro de este directorio.
  assets:
    - assets/logos/
    - assets/autenticacion/
    - assets/estados/
    - assets/inicio/
    - assets/fonts/LICENSE.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

  # En el futuro podremos agregar otras carpetas
  # cuando tengan archivos que necesitemos usar.
  #
  # Ejemplo:
  #
  # - assets/imagenes/
  # - assets/iconos/
  # - assets/animaciones/
